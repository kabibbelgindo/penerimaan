name: Build APK Penerimaan BR

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Instal dependensi
        run: npm ci

      - name: Sinkronkan web ke Android
        run: npx cap sync android

      - name: Siapkan keystore (opsional, dari Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/br-release.jks
            echo "BR_KEYSTORE_PATH=$RUNNER_TEMP/br-release.jks" >> $GITHUB_ENV
          fi

      - name: Build APK release
        working-directory: android
        env:
          BR_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BR_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          BR_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$BR_KEYSTORE_PATH" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            echo "Secrets keystore belum diisi, membuat APK debug."
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: Penerimaan-BR-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
